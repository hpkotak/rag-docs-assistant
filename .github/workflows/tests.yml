name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: .cache/models
          key: embed-model-bge-small-en-v1.5
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run python -m evals.retrieval
      - run: uv run python -m evals.run --trials 1
