<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tallyfox Help</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e4e2dc;
    --accent: #c2410c; --accent-soft: #fff1e8; --ok: #15803d; --ok-soft: #e9f7ee;
    --warn: #b45309; --warn-soft: #fff6e0; --bad: #b91c1c; --bad-soft: #fdecec; --chip: #f1f0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a09e97; --line: #34332f;
      --accent: #fb923c; --accent-soft: #3a2415; --ok: #4ade80; --ok-soft: #16301f;
      --warn: #fbbf24; --warn-soft: #362a10; --bad: #f87171; --bad-soft: #3a1818; --chip: #2a2a27;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 140px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .logo { width: 36px; height: 36px; border-radius: 9px; background: var(--accent); color: #fff;
          display: grid; place-items: center; font-weight: 700; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .chips button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px;
                  padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .chips button:hover { border-color: var(--accent); }
  .turn { margin-bottom: 22px; }
  .q { background: var(--accent); color: #fff; padding: 10px 14px; border-radius: 14px 14px 4px 14px;
       margin-left: auto; width: fit-content; max-width: 80%; }
  .answers { display: grid; gap: 12px; margin-top: 10px; }
  .answers.two { grid-template-columns: 1fr 1fr; }
  @media (max-width: 720px) { .answers.two { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .label { font-size: 12px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--muted);
           display: flex; justify-content: space-between; margin-bottom: 6px; }
  .text { white-space: pre-wrap; }
  .text strong { font-weight: 650; }
  .cites { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .cite { background: var(--chip); border-radius: 6px; padding: 2px 8px; font-size: 12px; color: var(--muted); }
  .cite.archived { background: var(--bad-soft); color: var(--bad); }
  .badge { display: inline-block; margin-top: 10px; padding: 3px 9px; border-radius: 6px; font-size: 12px; font-weight: 600; }
  .badge.handoff { background: var(--warn-soft); color: var(--warn); }
  .badge.guard { background: var(--ok-soft); color: var(--ok); font-weight: 500; }
  .thinking { color: var(--muted); font-style: italic; }
  form { position: fixed; left: 0; right: 0; bottom: 0; background: linear-gradient(transparent, var(--bg) 30%);
         padding: 28px 16px 20px; }
  .bar { max-width: 980px; margin: 0 auto; display: flex; gap: 8px; }
  .bar input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
               background: var(--panel); color: var(--ink); font: inherit; }
  .bar input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .bar button { padding: 0 18px; border: 0; border-radius: 12px; background: var(--accent); color: #fff;
                font: inherit; font-weight: 600; cursor: pointer; }
  .bar button:disabled { opacity: .5; cursor: default; }
  footer { color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">T</div>
    <div>
      <h1>Tallyfox Help</h1>
      <div class="sub">Answers from the help center, with sources. Tallyfox is a fictional company.</div>
    </div>
    <div class="spacer"></div>
    <label class="toggle"><input type="checkbox" id="compare"> Compare with the version as shipped</label>
  </header>
  <div class="chips" id="chips"></div>
  <div id="log"></div>
</div>
<form id="form">
  <div class="bar">
    <input id="q" autocomplete="off" placeholder="Ask about plans, invoices, payments, the API..." maxlength="500">
    <button id="send">Ask</button>
  </div>
</form>
<script>
const EXAMPLES = [
  "How long is the free trial?",
  "What's the API rate limit on Scale?",
  "We're a team of 8 on Growth. What will we pay per month?",
  "What uptime SLA do you guarantee?",
  "How do I get a refund on my annual plan?",
];
const NAMES = { v1: "As shipped", v2: "Fixed" };
const $ = (id) => document.getElementById(id);

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

// Render **bold** safely: split on the markers and build text nodes, never innerHTML.
function richText(s) {
  const out = el("div", "text");
  s.split(/(\*\*[^*]+\*\*)/g).forEach((part) => {
    if (/^\*\*[^*]+\*\*$/.test(part)) out.appendChild(el("strong", "", part.slice(2, -2)));
    else out.appendChild(document.createTextNode(part));
  });
  return out;
}

function card(version, a, showLabel) {
  const c = el("div", "card");
  if (showLabel) {
    const l = el("div", "label");
    l.appendChild(el("span", "", `${NAMES[version]} (${version})`));
    l.appendChild(el("span", "", `${a.seconds}s`));
    c.appendChild(l);
  }
  c.appendChild(richText(a.answer));
  if (a.citations.length) {
    const cs = el("div", "cites");
    a.citations.forEach((x) => cs.appendChild(el("span", "cite" + (x.archived ? " archived" : ""),
      x.label + (x.archived ? " (archived page)" : ""))));
    c.appendChild(cs);
  }
  if (a.handoff) c.appendChild(el("div", "badge handoff", "Passed to the support team"));
  (a.guards || []).forEach((g) => { c.appendChild(document.createElement("br")); c.appendChild(el("span", "badge guard", "Code check: " + g)); });
  return c;
}

async function ask(question) {
  if (!question.trim()) return;
  const compare = $("compare").checked;
  const versions = compare ? ["v1", "v2"] : ["v2"];
  const turn = el("div", "turn");
  turn.appendChild(el("div", "q", question));
  const answers = el("div", "answers" + (compare ? " two" : ""));
  answers.appendChild(el("div", "card thinking", "Searching the help center..."));
  turn.appendChild(answers);
  $("log").appendChild(turn);
  turn.scrollIntoView({ behavior: "smooth", block: "end" });
  $("send").disabled = true;
  try {
    const r = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" },
                                        body: JSON.stringify({ question, versions }) });
    const data = await r.json();
    answers.replaceChildren(...versions.map((v) => card(v, data.answers[v], compare)));
  } catch (e) {
    answers.replaceChildren(el("div", "card", "Something went wrong. Please try again."));
  } finally {
    $("send").disabled = false;
    turn.scrollIntoView({ behavior: "smooth", block: "end" });
  }
}

EXAMPLES.forEach((q) => {
  const b = el("button", "", q);
  b.type = "button";
  b.onclick = () => ask(q);
  $("chips").appendChild(b);
});
$("form").onsubmit = (e) => { e.preventDefault(); const q = $("q").value; $("q").value = ""; ask(q); };
</script>
</body>
</html>
