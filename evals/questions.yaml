# Eval set for the Tallyfox help assistant.
#
# Fields:
#   verdict   for yes/no questions: the first sentence must say "yes" or "no" (see evals/grade.py).
#             Keep the quotes: a bare yes or no is a YAML boolean, and the grader rejects it.
#   expect    facts the answer must contain. Each item is a string, or a list of accepted alternatives.
#   must_not  text the answer must not contain (stale values, wrong sums, invented numbers, injected text).
#   contradicts  text that makes the answer wrong even when the expected facts are also there.
#   evidence  text from the docs the answer depends on. Used to check retrieval: is it in the
#             sources sent to the model? A list inside means any one of those is enough.
#   cite      help articles the answer must cite. Each item is an article, or a list of articles where
#             citing any one is enough (e.g. a price that is on both the pricing page and the changelog).
#   handoff   true if the assistant should pass the question to a person, because the docs don't
#             answer it (or only answer part of it).
#
# Matching ignores case, commas in numbers, hyphens and trailing ".00" on dollar amounts.
#
# Checks marked "added after the runs" come from reading the saved answers: outdated values that the
# original checks let through (see "Limits of this test" in the README).

# --- Direct lookups -------------------------------------------------------------------------------
- id: growth-price
  category: lookup
  q: How much does the Growth plan cost per month?
  expect: ["$39"]
  evidence: ["| Growth | $39 |"]
  cite: [[plans-and-pricing, changelog]]

- id: starter-invoice-limit
  category: lookup
  q: How many invoices can I send each month on Starter?
  expect: [["50 invoices", "50 per month", "50 a month", "50 each month"]]  # was "50", which "up to 50 clients" also matched
  must_not: ["30 invoices"]
  evidence: ["| Invoices per month | 50 |"]
  cite: [plans-and-pricing]

- id: trial-length
  category: lookup
  q: How long is the free trial?
  expect: [["14 days", "14 day"]]
  must_not: ["30 days", "30 day"]
  evidence: ["14-day free trial"]
  cite: [plans-and-pricing]

- id: card-brands
  category: lookup
  q: Which card brands can my clients pay with?
  expect: ["visa", "mastercard", ["american express", "amex"]]
  evidence: ["Visa, Mastercard and American Express"]
  cite: [payment-methods]

- id: quickbooks-sync
  category: lookup
  q: How often does the QuickBooks Online sync run?
  expect: ["15 minutes"]
  evidence: ["every 15 minutes"]
  cite: [integrations]

- id: webhook-signature-header
  category: lookup
  q: Which header carries the webhook signature?
  expect: ["tallyfox-signature"]
  evidence: ["`Tallyfox-Signature` header"]
  cite: [api-webhooks]

- id: deletion-retention
  category: lookup
  q: How long do you keep my data after I delete my account?
  expect: ["30 days"]
  evidence: ["kept for 30 days after you delete the account"]
  cite: [data-export-deletion]

- id: live-key-prefix
  category: lookup
  q: What do live API keys start with?
  expect: ["tfx_live_"]
  evidence: ["Live keys start with `tfx_live_`"]
  cite: [api-authentication]

- id: error-e3001
  category: lookup
  q: The API gives me error E3001 when I create an invoice. What does it mean?
  expect: ["currency", ["growth", "scale"]]
  evidence: ["The invoice currency isn't enabled for your account"]
  cite: [api-errors]

- id: error-e2004
  category: lookup
  q: What does error code E2004 mean?
  expect: [["payment", "paid"], ["locked", "credit note"]]
  evidence: ["The invoice already has a payment recorded"]
  cite: [api-errors]

- id: zapier-triggers
  category: lookup
  q: Which Zapier triggers does Tallyfox have?
  expect: ["invoice paid", "invoice overdue", "new client"]
  evidence: ["**Invoice paid**, **Invoice overdue** and **New client**"]
  cite: [integrations]

- id: phone-support
  category: lookup
  q: What's your support phone number?
  expect: [["isn't available", "not available", "no phone", "don't offer", "do not offer", "doesn't offer", "does not offer", "isn't offered", "not offered", "no support phone", "don't have a support phone", "doesn't have phone"]]
  must_not: ["555", "1-800", "+1"]
  evidence: ["Phone support isn't available on any plan"]
  cite: [support]

